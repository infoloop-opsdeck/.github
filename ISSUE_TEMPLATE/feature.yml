name: Feature
description: New capability or improvement
type: Feature
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [People, Attendance, Payroll, Recruit, Visitor, CRM, Forms, ERP, Platform, New app]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: Customer problem (who, what job, how they do it today)
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome / acceptance criteria
  - type: dropdown
    id: plan
    attributes:
      label: Which plans get it
      options: [All plans, Suite only, Enterprise only, Not sure]
